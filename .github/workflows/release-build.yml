# GitHub release of a goobi workflow plugin (public or private mirror), with the same assets as the gitea release of the
# Jenkinsfile. Distributed from ci/plugin-template/ of goobi-workflow-collection; change it there, not in the plugin.
name: Publish Release Build

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        run: mvn clean verify -U -Drevision="${GITHUB_REF_NAME#v}" -DskipTests -Dcheckstyle.skip=true -Djacoco.skip=true
      - name: Package release assets
        run: bash .ci/package-release.sh "${{ github.event.repository.name }}"
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: target/release-assets/*
